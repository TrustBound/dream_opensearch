name = "dream_opensearch"
version = "3.0.0"
description = "Simple OpenSearch client for Gleam"
licences = ["MIT"]
repository = { type = "github", user = "TrustBound", repo = "dream_opensearch" }
links = [
    { title = "Documentation", href = "https://hexdocs.pm/dream_opensearch" },
    { title = "GitHub", href = "https://github.com/TrustBound/dream_opensearch" },
]

[documentation]
pages = [
    { title = "Getting started", path = "guides/getting-started.html", source = "./docs/guides/getting-started.md" },
    { title = "Searching an index", path = "guides/searching.html", source = "./docs/guides/searching.md" },
    { title = "Loading documents in bulk", path = "guides/bulk-loading.html", source = "./docs/guides/bulk-loading.md" },
    { title = "Managing indexes", path = "guides/managing-indexes.html", source = "./docs/guides/managing-indexes.md" },
    { title = "Handling errors", path = "guides/handling-errors.html", source = "./docs/guides/handling-errors.md" },
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 2.0.0 and < 4.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
# Switched to a Hex version range once it is published.
dream_http_client = { git = "https://github.com/TrustBound/dream_http_client.git", ref = "af661517f46417b72b67e84545ba6dcfc04fc59d" }

[dev-dependencies]
# Switched to a Hex version range once it is published.
dream_test = { git = "https://github.com/TrustBound/dream_test.git", ref = "1639959578a14ae3577f8e3ae5cac058f933aa53" }
# Switched to a Hex version range once it is published.
dream_snippets = { git = "https://github.com/TrustBound/dream_snippets.git", ref = "f116b072699ec33315980418036d962e22fab872" }

[tools.dream_snippets]
# Changelog sections and release notes before this version are history. They are not checked.
checked_from_version = "3.0.0"
