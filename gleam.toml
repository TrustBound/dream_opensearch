name = "dream_opensearch"
version = "3.0.0"
description = "Simple OpenSearch client for Gleam"
licences = ["MIT"]
repository = { type = "github", user = "TrustBound", repo = "dream_opensearch" }
links = [
    { title = "Documentation", href = "https://hexdocs.pm/dream_opensearch" },
    { title = "GitHub", href = "https://github.com/TrustBound/dream_opensearch" },
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 2.0.0 and < 4.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
# Switched to a Hex version range once it is published.
dream_http_client = { git = "https://github.com/TrustBound/dream_http_client.git", ref = "12f420aad3b04e8edd41891384bd0141df9e7657" }

[dev-dependencies]
# Switched to a Hex version range once it is published.
dream_test = { git = "https://github.com/TrustBound/dream_test.git", ref = "1639959578a14ae3577f8e3ae5cac058f933aa53" }
# Switched to a Hex version range once it is published.
dream_snippets = { git = "https://github.com/TrustBound/dream_snippets.git", ref = "7a862a3e5b74f0a7f2e9c15170d4d6c772605cfb" }

[tools.dream_snippets]
# Changelog sections and release notes before this version are history. They are not checked.
checked_from_version = "3.0.0"
